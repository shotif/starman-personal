<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <title>Model preview</title>
    <style>
      html,
      body {
        margin: 0;
        background: #6b6e73;
        font: 14px/1.3 system-ui, sans-serif;
        color: #f2f2f2;
      }
      #sheet {
        position: relative;
        width: 1200px;
        height: 840px;
      }
      #title {
        height: 40px;
        padding: 0 12px;
        display: flex;
        align-items: center;
        gap: 16px;
        background: #2c2f34;
        font-size: 16px;
      }
      #title b {
        font-size: 18px;
      }
      canvas {
        display: block;
        width: 1200px;
        height: 800px;
      }
      #labels {
        position: absolute;
        top: 40px;
        left: 0;
        width: 1200px;
        height: 800px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(2, 1fr);
        pointer-events: none;
      }
      #labels div {
        padding: 6px 8px;
        border: 1px solid #0003;
        text-shadow: 0 1px 2px #000;
      }
    </style>
  </head>
  <body>
    <div id="sheet">
      <div id="title"></div>
      <canvas id="view" width="1200" height="800"></canvas>
      <div id="labels"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
